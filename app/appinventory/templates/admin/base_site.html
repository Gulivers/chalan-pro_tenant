{% extends "admin/base_site.html" %}
{% load static %}

{% block extrahead %}
  {{ block.super }}
  <link rel="icon" href="{% static 'img/icons/favicon.ico' %}" sizes="any">
  <link rel="shortcut icon" href="{% static 'img/icons/favicon.ico' %}" type="image/x-icon">
  <link rel="apple-touch-icon" href="{% static 'img/icons/apple-touch-icon.png' %}">
{% endblock %}

{% block branding %}
  <h1 id="site-name">
    <a href="{% url 'admin:index' %}">Chalan Admin</a>
  </h1>
  {% comment %}
  <div style="margin-top: 10px;">
    <a href="{% url 'inventory-dashboard' %}" class="button default" style="margin-top:5px;">
        📊 Go to Dashboard
      </a>
  </div>
  {% endcomment %}
{% endblock %}
