# =============================================================================
# JobRhythm production — active domains only
# =============================================================================
# HTTP server - Landing (getjobrhythm.com, www.getjobrhythm.com) - Redirect to HTTPS
server {
    listen 80;
    server_name getjobrhythm.com www.getjobrhythm.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
# HTTP server - Frontend (jobrhythm.net, www.jobrhythm.net) - Redirect to HTTPS
server {
    listen 80;
    server_name jobrhythm.net www.jobrhythm.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP server - API and Admin (api.jobrhythm.net) - Redirect to HTTPS
server {
    listen 80;
    server_name api.jobrhythm.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTP server - Tenant subdomains (wildcard) - Redirect to HTTPS
server {
    listen 80;
    server_name *.jobrhythm.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
# HTTPS server - Landing (getjobrhythm.com, www.getjobrhythm.com)
server {
    listen 443 ssl http2;
    server_name getjobrhythm.com www.getjobrhythm.com;
    ssl_certificate /etc/letsencrypt/live/getjobrhythm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getjobrhythm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    # Contact form API → public Django (Host must be api.jobrhythm.net for django-tenants)
    location /api/landing/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host api.jobrhythm.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_redirect off;
    }

    location = /landing {
        return 301 /landing/;
    }

    location /landing/ {
        alias /usr/share/nginx/landing/;
        index index.html;
        add_header Cache-Control "public, max-age=300";
    }

    root /usr/share/nginx/landing;
    index index.html index.htm;
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "public, max-age=300";
    }
}
# HTTPS server - Frontend (jobrhythm.net, www.jobrhythm.net)
server {
    listen 443 ssl http2;
    server_name jobrhythm.net www.jobrhythm.net;

    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;

    ssl_certificate /etc/letsencrypt/live/jobrhythm.net-0001/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobrhythm.net-0001/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA256';
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    root /usr/share/nginx/html;
    index index.html index.htm;
    client_max_body_size 100M;

    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host api.jobrhythm.net;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location /static/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /media/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        expires 7d;
        add_header Cache-Control "public";
    }

    location ~* (service-worker\.js|manifest\.json)$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
