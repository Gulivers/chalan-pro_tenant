# =============================================================================
# Legacy domains → 301 permanent redirect to JobRhythm (no app content served)
# getjobrithm.com, jobrithm.net, chalanpro.net, chalanpro.com
# =============================================================================

map $host $legacy_landing_target {
    hostnames;
    getjobrithm.com       getjobrhythm.com;
    www.getjobrithm.com   www.getjobrhythm.com;
    chalanpro.com         getjobrhythm.com;
    www.chalanpro.com     www.getjobrhythm.com;
    default               "";
}

map $host $legacy_saas_apex_target {
    hostnames;
    jobrithm.net          jobrhythm.net;
    www.jobrithm.net      www.jobrhythm.net;
    api.jobrithm.net      api.jobrhythm.net;
    chalanpro.net         jobrhythm.net;
    www.chalanpro.net     www.jobrhythm.net;
    api.chalanpro.net     api.jobrhythm.net;
    default               "";
}

map $host $legacy_saas_tenant_target {
    ~^(?<tenant>[^.]+)\.jobrithm\.net$   $tenant.jobrhythm.net;
    ~^(?<tenant>[^.]+)\.chalanpro\.net$  $tenant.jobrhythm.net;
    default                             "";
}

map $legacy_saas_tenant_target $legacy_saas_https_target {
    ""      $legacy_saas_apex_target;
    default $legacy_saas_tenant_target;
}

# --- HTTP: redirect straight to HTTPS on new host ---
server {
    listen 80;
    server_name getjobrithm.com www.getjobrithm.com chalanpro.com www.chalanpro.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$legacy_landing_target$request_uri;
    }
}

server {
    listen 80;
    server_name jobrithm.net www.jobrithm.net api.jobrithm.net chalanpro.net www.chalanpro.net api.chalanpro.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$legacy_saas_https_target$request_uri;
    }
}

server {
    listen 80;
    server_name *.jobrithm.net *.chalanpro.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$legacy_saas_https_target$request_uri;
    }
}

# --- HTTPS: 301 only (certificates kept for SSL handshake) ---
server {
    listen 443 ssl http2;
    server_name getjobrithm.com www.getjobrithm.com;
    ssl_certificate /etc/letsencrypt/live/getjobrithm.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/getjobrithm.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://$legacy_landing_target$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chalanpro.com www.chalanpro.com;
    ssl_certificate /etc/letsencrypt/live/chalanpro.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chalanpro.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://$legacy_landing_target$request_uri;
}

server {
    listen 443 ssl http2;
    server_name jobrithm.net www.jobrithm.net api.jobrithm.net;
    ssl_certificate /etc/letsencrypt/live/jobrithm.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobrithm.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://$legacy_saas_https_target$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chalanpro.net www.chalanpro.net api.chalanpro.net;
    ssl_certificate /etc/letsencrypt/live/chalanpro.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chalanpro.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://$legacy_saas_https_target$request_uri;
}

server {
    listen 443 ssl http2;
    server_name *.jobrithm.net;
    ssl_certificate /etc/letsencrypt/live/jobrithm.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jobrithm.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://$legacy_saas_https_target$request_uri;
}

server {
    listen 443 ssl http2;
    server_name *.chalanpro.net;
    ssl_certificate /etc/letsencrypt/live/chalanpro.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chalanpro.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 301 https://$legacy_saas_https_target$request_uri;
}
